[package]
name = "isometric_game"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
rand = "0.8"
ron = "0.8"
serde = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
