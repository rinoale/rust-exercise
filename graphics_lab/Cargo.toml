[package]
name = "graphics_lab"
version = "0.1.0"
edition = "2024"
description = "A native Metal 3D sample and an independent macOS GPU interface experiment"

[features]
default = ["metal-app"]
metal-app = ["dep:metal", "dep:core-graphics-types"]

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
glam = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics-types = { version = "0.2", optional = true }
metal = { version = "0.33", optional = true }
objc = "0.2"
block2 = "0.5"
png = "0.17"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", default-features = false }

[[bin]]
name = "metal_cube"
path = "src/bin/metal_cube.rs"
required-features = ["metal-app"]

[[bin]]
name = "own_gpu"
path = "src/bin/own_gpu.rs"

[profile.dev]
opt-level = 1

# objc 0.2's selector macro checks this historical feature in its caller.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[[bin]]
name = "block_world"
path = "src/bin/block_world.rs"
required-features = ["metal-app"]

[[bin]]
name = "diagonal_world"
path = "src/bin/diagonal_world.rs"
required-features = ["metal-app"]
